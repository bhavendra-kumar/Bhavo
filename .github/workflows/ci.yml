name: Bhavo CI Pipeline

on:
  push:
    branches: [main, development, staging-hobby]
  pull_request:
    branches: [main, development, staging-hobby]

jobs:
  verify:
    name: Build & Test Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Static Code Analysis (Lint)
        run: npm run lint

      - name: TypeScript Type Checking
        run: npx tsc --noEmit

      - name: Execute Full Test Suite
        run: npm test

      - name: Next.js Production Build
        run: npm run build
